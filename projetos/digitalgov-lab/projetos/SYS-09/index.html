<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de indicadores · Laboratório</title><style>body{font-family:system-ui,sans-serif;background:#f2f6fa;color:#273b54;margin:0}main{max-width:1000px;padding:40px 20px;margin:auto}h1{margin-bottom:5px}p{color:#697d92}.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 13px #1232}input,textarea,select{display:block;margin:10px 0;padding:12px;width:100%;box-sizing:border-box;border:1px solid #c9d5e5;border-radius:6px}button{background:#175fad;color:white;border:0;padding:10px 16px;border-radius:6px;cursor:pointer}button.delete{background:#ac3a45}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6eef7}#msg{font-size:13px;min-height:24px}</style></head><body><main><div>SYS-09 / CRUD REAL DE LABORATÓRIO</div><h1>Catálogo de indicadores</h1><p>Funcionalidade demonstrativa com banco próprio, API real e validação. Não representa produto contratado ou aceite governamental.</p><section class="card"><form id="form"><label>Título<input name="title" required maxlength="140"></label><label>Descrição<textarea name="description" maxlength="2000"></textarea></label><label>Situação<select name="status"><option>ABERTO</option><option>EM_ANALISE</option><option>EM_EXECUCAO</option><option>CONCLUIDO</option></select></label><button id="save" type="submit">Criar registro</button><button id="cancel" type="button" hidden>Cancelar edição</button></form><div id="msg" aria-live="polite"></div><table><thead><tr><th>ID</th><th>Título</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></section><p><a href="/service"><strong>Abrir operação especializada do item do edital →</strong></a></p></main><script src="/app.js"></script></body></html>
