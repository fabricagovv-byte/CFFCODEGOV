# Ambiente local / homologação. Uso: cp .env.example .env && docker compose up -d --build
name: gestao-documental
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_documental}
      POSTGRES_USER: ${POSTGRES_USER:-gd_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      secrets: [ca_extra]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gd_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gestao_documental}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      UPLOAD_DIR: /dados/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8080}
      CORS_ORIGINS: ${URL_PUBLICA:-http://localhost:8080}
    volumes: [uploads:/dados/uploads]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      secrets: [ca_extra]
    ports: ["${PORTA_HTTP:-8080}:80"]
    depends_on: [backend]
    restart: unless-stopped

secrets:
  # Certificado extra para build atrás de proxy com inspeção TLS (opcional).
  ca_extra:
    file: ${CA_EXTRA_FILE:-/dev/null}

volumes:
  dbdata:
  uploads:
