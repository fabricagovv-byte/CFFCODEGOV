# Módulos gerados do formulário, prontos para colar na OS AUTORIZADA (contratos/<C>/os/<OS>.yaml -> modulos).
modulos:
- id: MOD-101
  nome: Unidades de atendimento
  servicos:
  - codigo: SRV-CRUD-M
    quantidade: 1.0
  tem_interface: true
  caminhos:
  - backend/app/modulos/unidades
  - backend/migrations/versions/0003_unidades.py
  - backend/tests/test_mod101_unidades.py
  - frontend/src/modulos/unidades
  - especificacoes/unidades.yaml
  testes:
  - nome: backend
    cwd: backend
    cmd:
    - python3
    - -m
    - pytest
    - tests/test_mod101_unidades.py
    - -v
    - --junitxml={junit}
  - nome: frontend
    cwd: frontend
    cmd:
    - npx
    - vitest
    - run
    - src/modulos/unidades/UnidadePagina.test.tsx
    - --reporter=default
    - --reporter=junit
    - --outputFile.junit={junit}
