# Projeto proj-protocolo com o próprio PostgreSQL (dados em volume isolado).
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proj_protocolo
      POSTGRES_USER: proj_protocolo_app
      POSTGRES_PASSWORD: ${SENHA_BANCO:?defina SENHA_BANCO no .env}
    volumes: [banco:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U proj_protocolo_app"], interval: 5s, retries: 10}
  app:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://proj_protocolo_app:${SENHA_BANCO}@banco:5432/proj_protocolo
      GERENCIADOR_TOKEN: ${GERENCIADOR_TOKEN:?defina GERENCIADOR_TOKEN no .env}
    depends_on: {banco: {condition: service_healthy}}
    ports: ["127.0.0.1:8100:8000"]
volumes:
  banco:
