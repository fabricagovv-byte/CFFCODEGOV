# OS-FIC-002 — correção e endurecimento da base do pacote DIGITALGOV (12 achados do DIAGNOSTICO_EXECUCAO.md).
# Os testes usam o Python indicado em DG_PYTHON (padrão: python3) com as dependências de requirements.txt.
os: OS-FIC-002
contrato: FIC-COM-2026-001
titulo: Correção e endurecimento da base (12 achados do diagnóstico)
projeto: contratos/FIC-COM-2026-001/laboratorio
aviso_medicao: "Catálogo PROPOSTO-V1 aprovado pela contratada em 06/11/2026 (R$ 30,00 por UST), pendente de ratificação pelo órgão. A medição parcial (cada módulo dividido pelos itens de escopo do TR) é proposta da contratada e depende de confirmação. Sem OS assinada pelo órgão, nenhuma quantidade é considerada aceita."
autorizacao:
  autorizado: true
  autorizado_por: "Responsável técnico da contratada (autorização interna; conta fabricagovv@gmail.com)"
  data: "2026-11-06"
  documento: "Autorização interna registrada em 06/11/2026 na sessão de trabalho Claude Code (decisão D-0004); OS do órgão pendente"

# O projeto não segue o arranjo backend/ frontend/ do modelo da fábrica: onde o checklist encontra cada item.
caminhos_checklist:
  backend/app: PLATAFORMA_COMUNICACAO/app
  backend/app/main.py: PLATAFORMA_COMUNICACAO/app/main.py
  backend/migrations/versions: PLATAFORMA_COMUNICACAO/migrations
  backend/requirements.txt: PLATAFORMA_COMUNICACAO/requirements.txt
  backend/Dockerfile: PLATAFORMA_COMUNICACAO/Dockerfile
  ../../.github/workflows/ci.yml: ../../../.github/workflows/ci.yml

modulos:
  - id: MOD-001
    nome: Controle de sessão (TR M01, item 2 de 4)
    area: BACKEND
    item_tabela: CAT-M01-02
    ust_previsto: 202.5
    tem_interface: true
    achados: [6, 7]
    perfis: [PROG_SR_BD, PROG_SR_BACK, PROG_SR_FRONT, PROG_SR_TESTES]
    entrega:
      banco_de_dados:
        - "Tabela de sessões (sessions): cada acesso com validade de 8 horas e data de encerramento"
        - "Tabela de tentativas de acesso (login_attempts), com índices por usuário e por IP"
        - "Migração 0002 com reversão"
      back_end:
        - "Login cria a sessão no servidor (POST /api/login)"
        - "Saída encerra a sessão no servidor (POST /api/logout)"
        - "Toda rota protegida confere se a sessão existe, não foi encerrada e não venceu"
        - "Bloqueio após 5 senhas erradas em 15 minutos por usuário (20 por IP)"
        - "Registro de acesso, falha, bloqueio e saída na auditoria"
      front_end:
        - "Botão Sair encerra a sessão no servidor"
        - "Mensagem de bloqueio na tela de acesso"
    caminhos: [PLATAFORMA_COMUNICACAO/app/security.py, PLATAFORMA_COMUNICACAO/app/main.py,
               PLATAFORMA_COMUNICACAO/migrations/0002_sessoes_e_tentativas.up.sql, PLATAFORMA_COMUNICACAO/migrations/0002_sessoes_e_tentativas.down.sql,
               PLATAFORMA_COMUNICACAO/static/app.js, PLATAFORMA_COMUNICACAO/tests/test_mod001_sessao.py]
    testes:
      - {nome: sessao, cwd: PLATAFORMA_COMUNICACAO, cmd: [sh, -c, "${DG_PYTHON:-python3} -m pytest -p no:cacheprovider tests/test_mod001_sessao.py -v --junitxml={junit}"]}
      - {nome: regressao-comunicacao, cwd: PLATAFORMA_COMUNICACAO, cmd: [sh, -c, "${DG_PYTHON:-python3} -m pytest -p no:cacheprovider tests -q --junitxml={junit}"]}
  - id: MOD-002
    nome: Correções de validação e privacidade (M03, M05, M07, M08)
    area: BACKEND
    item_tabela: CORRETIVA-SEM-ITEM
    ust_previsto: 0
    tem_interface: true
    achados: [3, 4, 5, 10, 11, 12]
    caminhos: [PLATAFORMA_COMUNICACAO/app/main.py, PLATAFORMA_COMUNICACAO/migrations/0003_campanha_canal_fk.up.sql,
               PLATAFORMA_COMUNICACAO/migrations/0003_campanha_canal_fk.down.sql, PLATAFORMA_COMUNICACAO/static/app.js,
               PLATAFORMA_COMUNICACAO/tests/test_mod002_validacao_privacidade.py]
    testes:
      - {nome: validacao-privacidade, cwd: PLATAFORMA_COMUNICACAO, cmd: [sh, -c, "${DG_PYTHON:-python3} -m pytest -p no:cacheprovider tests/test_mod002_validacao_privacidade.py -v --junitxml={junit}"]}
      - {nome: regressao-comunicacao, cwd: PLATAFORMA_COMUNICACAO, cmd: [sh, -c, "${DG_PYTHON:-python3} -m pytest -p no:cacheprovider tests -q --junitxml={junit}"]}
  - id: MOD-003
    nome: Base técnica — migrações versionadas, cabeçalhos de segurança, dependências
    area: DEVOPS
    item_tabela: CORRETIVA-SEM-ITEM
    ust_previsto: 0
    tem_interface: false
    achados: [8, 9, 13]
    caminhos: [PLATAFORMA_COMUNICACAO/app/migrations.py, PLATAFORMA_COMUNICACAO/app/db.py, PLATAFORMA_COMUNICACAO/app/cli.py,
               PLATAFORMA_COMUNICACAO/migrations/0001_inicial.up.sql, PLATAFORMA_COMUNICACAO/migrations/0001_inicial.down.sql,
               PLATAFORMA_COMUNICACAO/requirements.txt, PLATAFORMA_COMUNICACAO/static/style.css, PLATAFORMA_COMUNICACAO/README.md,
               PLATAFORMA_COMUNICACAO/tests/conftest.py, PLATAFORMA_COMUNICACAO/tests/test_mod003_base_tecnica.py,
               PLATAFORMA_COMUNICACAO/tests/test_backup.py, PLATAFORMA_COMUNICACAO/requirements-dev.txt,
               PLATAFORMA_COMUNICACAO/Dockerfile, FABRICA/Dockerfile, docker-compose.yml, docker-compose.prod.yml,
               infra/nginx/default.conf, infra/nginx/prod-tls.conf, infra/scripts/backup.sh, infra/scripts/restore.sh,
               .env.example, README.md, docs/MANUAL_PUBLICACAO.md, docs/MANUAL_OPERACAO.md, docs/PLANO_CONTINUIDADE.md]
    testes:
      - {nome: base-tecnica, cwd: PLATAFORMA_COMUNICACAO, cmd: [sh, -c, "${DG_PYTHON:-python3} -m pytest -p no:cacheprovider tests/test_mod003_base_tecnica.py tests/test_backup.py -v --junitxml={junit}"]}
      - nome: compose-valido
        tipo: comando
        cwd: .
        cmd: [sh, -c, "DG_COMM_SECRET=x DG_FACTORY_TOKEN=y DOMINIO=exemplo.gov.br docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q"]
      - nome: migracoes-ida-e-volta
        tipo: comando
        cwd: PLATAFORMA_COMUNICACAO
        cmd: [sh, -c, "f=$(mktemp -d)/m.db && export DG_COMM_DB=$f && P=${DG_PYTHON:-python3} && $P -m app.cli init && $P -m app.cli rollback --to 1 && $P -m app.cli migrations | grep -q \"'atual': 1\" && $P -m app.cli init && $P -m app.cli migrations | grep -q \"'pendentes': \\[\\]\""]
  - id: MOD-004
    nome: Painel da fábrica — chave de acesso (ferramenta interna)
    area: FRONTEND
    item_tabela: INTERNO-FABRICA
    ust_previsto: 0
    tem_interface: true
    achados: [1, 2]
    caminhos: [FABRICA/app/main.py, FABRICA/static/index.html, FABRICA/static/painel.js, FABRICA/static/painel.css,
               FABRICA/requirements.txt, FABRICA/README.md, FABRICA/tests/test_mod004_login_painel.py,
               FABRICA/tests/test_painel_js.py, FABRICA/tests/test_factory.py, start_local.sh]
    testes:
      - {nome: painel, cwd: FABRICA, cmd: [sh, -c, "${DG_PYTHON:-python3} -m pytest -p no:cacheprovider tests -v --junitxml={junit}"]}
