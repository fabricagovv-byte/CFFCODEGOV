# Repassa a plataforma de comunicação (telas e API) na rede interna do Compose.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript application/json;

  # IP real só quando vem de rede privada (proxy de borda / Docker)
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  location = /api/login {
    limit_req zone=login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://comunicacao:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://comunicacao:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
