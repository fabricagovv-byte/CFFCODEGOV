# Proxy reverso de borda com TLS (homologação/produção).
# Certificados fornecidos pelo órgão ou emitidos por autoridade certificadora, montados em /etc/nginx/certs.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
  listen 80;
  server_name ${DOMINIO};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMINIO};
  server_tokens off;
  client_max_body_size 2m;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /api/login {
    limit_req zone=login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://comunicacao:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://comunicacao:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
