    tem_interface: true
    caminhos: [backend/app/routers/pesquisa.py, backend/tests/test_mod004_pesquisa.py, frontend/src/pages/Pesquisa.tsx,
               frontend/src/pages/Pesquisa.test.tsx]
    testes:
