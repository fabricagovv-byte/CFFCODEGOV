# OS FICTÍCIA DE TESTE (Parte 17 do prompt mestre). UST sem valor contratual.
os: OS-TESTE-001
contrato: TESTE-001
titulo: Gestão Documental Pública
projeto: projetos/gestao-documental
aviso_medicao: "UST FICTÍCIAS — demonstração da fábrica, sem valor para faturamento."
autorizacao:
  autorizado: true
  autorizado_por: "solicitante da sessão Claude Code (instrução 'Executar TESTE-001')"
  data: "2026-11-03"
  documento: "Prompt mestre — Partes 17 e 19"

# Variável opcional: TEST_DATABASE_URL (PostgreSQL real). Sem ela, os testes usam SQLite.
modulos:
  - id: MOD-001
    nome: Autenticação e controle de acesso
    item_tabela: UST-TESTE-MOD
    ust_previsto: 2
    tem_interface: true
    caminhos: [backend/app/security.py, backend/app/permissions.py, backend/app/mail.py, backend/app/routers/auth.py,
               backend/app/routers/usuarios.py, backend/tests/test_mod001_auth.py, frontend/src/auth.tsx,
               frontend/src/pages/Login.tsx, frontend/src/pages/Login.test.tsx, frontend/src/pages/EsqueciSenha.tsx,
               frontend/src/pages/RedefinirSenha.tsx]
    testes:
      - {nome: backend, cwd: backend, cmd: [python3, -m, pytest, tests/test_mod001_auth.py, -v, "--junitxml={junit}"]}
      - {nome: frontend, cwd: frontend, cmd: [npx, vitest, run, src/pages/Login.test.tsx, --reporter=default, --reporter=junit, "--outputFile.junit={junit}"]}
  - id: MOD-002
    nome: Cadastro documental
    item_tabela: UST-TESTE-MOD
    ust_previsto: 2
    tem_interface: true
    caminhos: [backend/app/routers/documentos.py, backend/tests/test_mod002_documentos.py, frontend/src/pages/Documentos.tsx,
               frontend/src/pages/FormDocumento.tsx, frontend/src/pages/DocumentoDetalhe.tsx, frontend/src/pages/Documentos.test.tsx]
    testes:
      - {nome: backend, cwd: backend, cmd: [python3, -m, pytest, tests/test_mod002_documentos.py, -v, "--junitxml={junit}"]}
      - {nome: frontend, cwd: frontend, cmd: [npx, vitest, run, src/pages/Documentos.test.tsx, --reporter=default, --reporter=junit, "--outputFile.junit={junit}"]}
  - id: MOD-003
    nome: Upload de PDF
    item_tabela: UST-TESTE-MOD
    ust_previsto: 2
    tem_interface: true
    caminhos: [backend/app/storage.py, backend/app/routers/arquivos.py, backend/tests/test_mod003_upload.py,
               frontend/src/components/UploadPdf.tsx, frontend/src/components/UploadPdf.test.tsx]
    testes:
      - {nome: backend, cwd: backend, cmd: [python3, -m, pytest, tests/test_mod003_upload.py, -v, "--junitxml={junit}"]}
      - {nome: frontend, cwd: frontend, cmd: [npx, vitest, run, src/components/UploadPdf.test.tsx, --reporter=default, --reporter=junit, "--outputFile.junit={junit}"]}
