# Fonte: texto extraído por página (pNNN.txt). Páginas lidas integralmente: p069–p089, p141–p159, p163–p170.
# Situação: EXTRAÍDO DO EDITAL (não verificado juridicamente, não aceito). O que não está escrito = "não consta".
# Convenção de origem: "pNNN, <documento> item X". TR = Termo de Referência (itens 17–21); CONTRATO = minuta de contrato (itens 5–17);
# ANEXO I.VIII = Declaração de LGPD.

meta:
  agente: G23
  edital: PE 223/2026 - Paraná
  paginas_lidas: ["p069-p089", "p141-p159", "p163-p170"]
  estado: EXTRAIDO (PLANEJADO para monitoramento; nada EXECUTADO/VERIFICADO/ACEITO)
  observacao_geral: >
    O ANS (TR item 18.6, p070-p072) é uma tabela de 26 ocorrências com GRAU 1 a 5. Não há indicadores
    quantitativos com meta percentual, fórmula de cálculo nem janela de apuração, exceto o item 4 (indisponibilidade
    superior a 24 horas). A "meta" de cada item é, portanto, ocorrência zero. A penalidade de cada grau é percentual
    ao dia sobre o "valor mensal do contrato" (termo não definido nas páginas lidas); o item 18.5 (p070) diz que os
    descontos são aplicados na fatura mensal.

