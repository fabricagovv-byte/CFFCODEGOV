proposta:
  estrutura:
    cabecalho_dados_do_prestador:
      - "Inscrito no CAUF/PR: [ ] Sim [ ] Não (Cadastro Único de Fornecedores do Estado do Paraná)"
      - CNPJ
      - Inscrição Estadual
      - Endereço, Bairro, CEP, Cidade, Estado
      - Representante comercial
      - Telefone
      - e-mail
      - Banco, Agência, Conta-corrente
    declaracoes_numeradas: "Itens 1 a 8 (objeto; serviços na última página; validade 180 dias; responsabilidade por qualidade/garantia; preços com todos os custos; materiais inclusos; atesto das exigências técnicas do Anexo I; declaração do art. 63 §1º da Lei 14.133/2021)"
    colunas_da_planilha:
      - ID
      - Serviço (Unidades de Serviço Técnico – UST)
      - Métrica
      - Qtd. Estimada (Ano)
      - Fator de Complex
      - Qtd. Ajustada pela Complex
      - VALOR UNITÁRIO (R$)
      - VALOR TOTAL (R$)
    linhas: "15 serviços (ID 1 a 15) + linha Total 'USTs totais por ano'"
    fechamento: "Local e data; Representante Legal"
  unidade_de_preco: "UST (coluna 'Métrica' = UST para todos os 15 itens); preço informado em 'VALOR UNITÁRIO (R$)' por item"
  como_preencher: >
    Preencher os dados do prestador e, na planilha da última página, as colunas
    'VALOR UNITÁRIO (R$)' e 'VALOR TOTAL (R$)' de cada item (as colunas de quantidade e fator
    já vêm preenchidas pelo órgão). O edital NÃO diz expressamente se o VALOR TOTAL deve ser
    calculado sobre a 'Qtd. Estimada (Ano)' ou sobre a 'Qtd. Ajustada pela Complex' (ver conflitos).
  validade: "180 (cento e oitenta) dias (p134 item 3; p179 item 3)"
  exigencias:
    - "Preços cotados contemplam todos os custos diretos, indiretos e despesas, inclusive impostos e taxas (p134 item 5; p179 item 5)"
    - "Quando for o caso, contemplam o fornecimento de materiais inerentes ao serviço (p134 item 6; p179 item 6)"
    - "Empresa vencedora responde pela qualidade, inclusive no período de garantia; refaz às suas expensas serviços com vícios (p134 item 4; p179 item 4)"
    - "Atestar o atendimento das exigências técnicas do Anexo I do Edital (p134 item 7; p179 item 7)"
    - "Declarar que a proposta compreende a integralidade dos custos trabalhistas (art. 63 §1º Lei 14.133/2021; CF, leis, normas infralegais, convenções coletivas, TACs) (p134 item 8; p179 item 8)"
    - "Indicar se é inscrito no CAUF/PR (p133; p179)"
    - "Informar dados bancários (p133; p179); pagamentos condicionados à conta na instituição financeira contratada pelo Estado – Decreto Estadual 4.505/2016 (p193 item 9.2.1)"
    - "Assinatura do representante legal com local e data (p134; p180)"
  origem: "Anexo I.IV – Modelo de descritivo da proposta de preços (p133–p136) e Anexo III do Edital – Modelo de descritivo da proposta de preços (p179–p183)"

