#   p133–p140, p143 (e p141, p142, p144 para completar as cláusulas 5–9 da minuta Anexo I.VI),
#   p179–p183 (Anexo III do edital), p190–p209 (Anexo IX – minuta de contrato).
# Regra: só consta o que está escrito. "não consta" = não encontrado nas páginas lidas.
# Toda cifra abaixo é transcrição do edital; nenhuma é estimativa da fábrica.
status: EXTRAIDO_DO_EDITAL (não é proposta comercial; requer revisão humana)
