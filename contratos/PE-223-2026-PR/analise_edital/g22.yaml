formula_mensalidade:
  descricao: >
    NÃO CONSTA fórmula explícita de valor mensal nas páginas lidas. O que está escrito:
    (a) paga-se os preços unitários da proposta (3.1); (b) pagamentos dependem dos quantitativos
    efetivamente prestados (3.2.1; 9.6; 10.2.7); (c) NF conforme RELATÓRIO MENSAL elaborado pelo
    Contratado e aprovado pelo Contratante (10.1.19); (d) deduzem-se glosas, notas de débito (9.1),
    multas (9.3.1) e retenções (9.5). Não está escrito se o valor unitário incide sobre UST da
    'Qtd. Estimada' ou da 'Qtd. Ajustada pela Complex' (fator 1/2/3), nem como se mede a UST da OS.
    Leitura literal possível (NÃO confirmada, depende do TR): valor do mês = Σ (UST efetivamente
    prestadas e aprovadas no relatório mensal × valor unitário do item) − glosas − multas − retenções.
  origem: "p140 itens 3.1/3.2.1; p143–p144 itens 9.1/9.3.1/9.5/9.6; p191 item 3; p193–p194 item 9; p195 item 10.1.19; p196 item 10.2.7"

