pagamento:
  regra: >
    O Contratante paga os preços unitários da proposta (3.1) apenas sobre os quantitativos de serviços
    efetivamente prestados (3.2.1, 9.6, 10.2.7). Regime: Empreitada por Preço Unitário (6.1).
    Notas Fiscais emitidas em conformidade com o RELATÓRIO MENSAL elaborado pelo Contratado e aprovado
    pelo Contratante (10.1.19). Descontam-se glosas, notas de débito (9.1), multas não pagas (9.3.1),
    retenções tributárias na fonte (9.5, 10.2.8) e valores de serviços não executados ou executados em
    desacordo (10.1.12). Atraso não causado pelo Contratado: EM = I × N × VP, I = 6%/365 = 0,00016438 (9.4).
  prazo: "Não superior a 30 (trinta) dias contados do atesto da Nota Fiscal (9.1). Prazo suspenso na hipótese do item 12.4.1 (9.3)."
  recebimento: "Provisório em 30 dias mediante termo detalhado (6.4); definitivo em 60 dias contados do provisório (6.6); se não feito no prazo, reputa-se realizado (6.7)."
  documentos_para_pagamento:
    - "Nota Fiscal atestada, conforme Relatório Mensal aprovado pelo Contratante (9.1; 10.1.19)"
    - "Comprovação de adimplemento de todas as obrigações (9.1)"
    - "Certificado de Regularidade Fiscal (CRF) emitido no GMS: Fiscos Federal, Estadual (inclusive PR para sediados em outro Estado) e Municipal, FGTS, INSS e CNDT (9.1)"
    - "Prévia informação de conta corrente na instituição financeira contratada pelo Estado – Decreto Estadual 4.505/2016 (9.2.1)"
    - "Documentos exigidos e irregularidades sanadas na NF, na prestação e nas obrigações (9.2)"
  origem: "Anexo I.VI p140 item 3, p141 item 6, p143–p144 item 9; Anexo IX p191 item 3, p192 item 6, p193–p194 item 9, p195 item 10.1.19, p196 itens 10.2.7–10.2.8"

