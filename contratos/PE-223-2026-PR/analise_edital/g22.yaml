  - {descricao: "Não está definido se o VALOR TOTAL por item = valor unitário × Qtd. Estimada (130.000) ou × Qtd. Ajustada pela Complex (325.000). Diferença de 2,5× no valor global.", paginas: "p135–p136; p181–p183"}
  - {descricao: "Item 14 'Gestão de Segurança da Informação' tem descrição de integração (APIs, orquestração, legados, SQL/NoSQL); item 15 'Integração de Sistemas' descreve soluções de software (ITSM, monitoramento, gestão de projetos, plataforma low-code). Descrições aparentam deslocadas; item 15 sugere fornecimento de software/licenças precificado em UST.", paginas: "p136; p182–p183"}
  - {descricao: "Sobreposição entre item 9 (BI e Ciência de Dados inclui 'IA, algoritmos... redes neurais') e item 10 (Desenvolvimento de IA): risco de enquadramento duplo/divergente.", paginas: "p135–p136; p182"}
  - {descricao: "Item 2 (2º nível) é 'atendimento presencial', mas cláusula 6.3 diz que os serviços serão prestados na sede da CONTRATADA conforme Anexo VII.", paginas: "p135; p141; p192"}
