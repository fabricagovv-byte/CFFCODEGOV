  - {descricao: "Item 6.2 truncado: 'O serviço terá início em com a assinatura do contrato'.", paginas: "p141; p192"}
  - {descricao: "Garantia: 11.1 prazo de 30 dias; 11.1.1 para seguro-garantia prazo 'de, no mínimo, 01 (um) mês'. Base 'valor do Contrato' é estimativo e indefinido (R$ XX,XX).", paginas: "p197; p191"}
  - {descricao: "Rodapé do Anexo IX: 'Minuta Padronizada... sem dedicação exclusiva de mão de obra - sem objeto definido'; ao mesmo tempo 10.1.10 exige alocar recursos quantos forem necessários.", paginas: "p190–p209; p194"}
