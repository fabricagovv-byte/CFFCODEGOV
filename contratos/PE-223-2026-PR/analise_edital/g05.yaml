# G05 — Arquiteto de Software
# Fonte: PE 223/2026 (Paraná), páginas p104–p122 (Anexo I.I Requisitos da PoC; Anexo I.II Roteiro da PoC).
# Situação: PLANEJADO (análise documental). Nada aqui foi executado nem verificado em ambiente da PoC.
# Avaliação da fábrica feita sobre projetos/gestao-documental (FastAPI+PostgreSQL+React/Vite, Docker Compose, GitHub Actions).

poc:
  objetivo: >-
    Comprovar a capacidade técnica e operacional da empresa em entregar, em curto prazo, uma solução integrada
    de TI: (1) aplicação de controle de acesso SSO (cadastro, login único, permissões, OAuth2) e (2) aplicação
    cliente-servidor de gestão de dados (ingestão de datasets IPARDES, ETL assíncrono em fila, notificação por
    e-mail, dashboards), conteinerizadas e orquestradas (Kubernetes), com CI/CD, GitOps, observabilidade
    (métricas, logs, tracing, alertas), testes automatizados de UI e API, documentação em português e LGPD.
    Abrange "pelo menos 500 UST de trabalho". No rito, é etapa de julgamento (não de habilitação) para comprovar,
    por amostragem técnica, a capacidade da 1ª colocada já habilitada.
  prazo_preparacao: >-
    Convocação formal com não menos de 5 (cinco) dias úteis de antecedência (p118, item 3). O conteúdo da prova
    (anexo sigiloso) só é entregue no início da sessão (p118 intro; p121–p122 itens 10 e 13).
  duracao: >-
    5 (cinco) dias úteis (p104 item 1; p116 item 5; p118 item 3). Demandas entregues por inteiro no começo e
    entrega única ao fim do 5º dia útil, sem cronômetro por item nem etapas parciais (p119 item 6).
  local_forma: >-
    Presencial, em dependências indicadas pela Administração em Curitiba/PR (p118 item 3). Sala exclusiva e
    isolada, crachá temporário, rede segregada com firewall e saída à Internet só para destinos liberados
    (provedor de identidade de teste OAuth2, repositórios oficiais de dependências, ferramenta de observabilidade
    da prova) (p119 item 8). Ambiente de execução, orquestrador, plataforma de versionamento, IdP de teste e
    massas de dados fictícias/mascaradas fornecidos pela Administração; computadores da empresa só como estações;
    código fica na plataforma de versionamento da Administração (p118 item 4; p120 item 8.2). Tráfego de rede
    registrado (metadados) (p119–p120 item 8.1). Proibida IA generativa (p120 item 8.3). Proibidas conexões
    externas (p120 item 8.4). Captação audiovisual da sala com observadores (p120 item 9). Sorteio aberto de uma
    entre três versões equivalentes (V1/V2/V3) do enunciado (p121 item 10).
  criterios_aprovacao:
    - "Correção por banca técnica (fiscal técnico + especialistas); cada item apurado por critério binário atende/não atende, subsidiariamente por escala objetiva (p118–p119 item 5)."
    - "Aprova-se quem atingir nota mínima sobre a soma ponderada dos itens marcados como atende; sem itens eliminatórios isolados; sem correção fracionada; tolerância embutida na nota mínima (p119 item 6)."
    - "Eixos, pesos, forma de pontuar e nota mínima declarados como conhecidos de antemão pelo Roteiro (p119 item 6) — porém os valores NÃO constam das páginas p104–p122 (ver conflitos)."
    - "Tabela de requisitos do Anexo I.I serve de checklist Atendido/Não Atendido; todos os pontos obrigatórios devem ser cumpridos na demonstração final (p111 item 4)."
    - "Validação durante a apresentação e pela análise dos artefatos (código, documentação, relatórios de teste) (p116)."
    - "Sucesso condicionado ao atendimento completo dos requisitos, especialmente itens críticos: SSO funcional, ingestão de dados IPARDES, pipeline CI/CD operacional e monitoramento Prometheus/Grafana ativo (p116)."
    - "Requisito não atendido exige justificativa documentada e, se possível, plano para fase posterior (p116)."
    - "Regras essenciais cuja violação reprova: uso de correio/mensageiro/nuvem pessoal etc. (p120 item 8.1); plataformas externas ou cópia do acervo para fora (p120 item 8.2); uso de IA generativa (p120 item 8.3); conexões externas não oficiais (p120 item 8.4)."
    - "Equipe executora indicada pela empresa, vedada troca não justificada (p118 item 5); termo de sigilo antes de iniciar (p119 item 7)."
  consequencia_reprovacao: >-
    Reprovação fundamentada e registrada em ata, com contraditório na fase de recursos (p119 item 6); convoca-se a
    empresa seguinte na ordem de classificação para a mesma etapa (p118 item 3), com redação diversa do enunciado
    (p121 item 10). Na fase de recursos a reprovada tem acesso ao enunciado aplicado, à sua entrega e à
    fundamentação de cada item reprovado (p121 item 12). Código da prova nunca é aproveitado em produção (p121 item 11).
  origem: "p104 (Anexo I.I item 1), p105 item 2, p111 item 4, p116, p118–p122 (Anexo I.II itens 1–13)"

poc_requisitos:
  # --- Tabela de requisitos (checklist da banca) — p111 a p116 ---
  - {id: R01, requisito: "SSO permite cadastro de novos usuários (criação de contas)", como_demonstrar: "Criar conta na aplicação de SSO e logar com ela", origem: "p111 item 4 (Funcional - SSO/Autenticação); p105 2.1.1"}
  - {id: R02, requisito: "Login de usuários utilizando CPF e senha", como_demonstrar: "Login na tela do SSO informando CPF e senha", origem: "p111 item 4"}
  - {id: R03, requisito: "Single Sign-On integrado entre todas as aplicações da PoC (um único login válido em todos os módulos)", como_demonstrar: "Logar uma vez no SSO e acessar a aplicação de gestão de dados sem novo login", origem: "p111 item 4; p105 2.1.1"}
  - {id: R04, requisito: "Mais de um perfil de acesso (pelo menos administrador e usuário comum)", como_demonstrar: "Mostrar diferença de acesso entre admin e usuário comum", origem: "p111 item 4"}
  - {id: R05, requisito: "Gerenciamento básico de usuários (criação, edição e desativação de contas)", como_demonstrar: "Admin cria, edita e desativa conta; conta desativada não loga", origem: "p111 item 4"}
  - {id: R06, requisito: "Fluxos OAuth2.0 para emissão e validação de tokens de acesso", como_demonstrar: "Fluxo OAuth2 (ex.: authorization code) com emissão e validação/introspecção de token; integração com o provedor de identidade de teste da Administração", origem: "p111 item 4; p105 2.1.1; p118 item 4; p119 item 8"}
  - {id: R07, requisito: "Importar conjuntos de dados por interface de envio de arquivo para processamento", como_demonstrar: "Upload de arquivo pela tela da aplicação de gestão de dados", origem: "p111 item 4; p105 2.1.2.1"}
  - {id: R08, requisito: "ETL sobre dados importados da base Demografia (IPARDES), com transformações e limpezas para gerar visualizações", como_demonstrar: "Processar arquivo de Demografia e exibir resultado nos gráficos", origem: "p111 item 4; p106 2.1.2.1.1 e 2.1.2.2"}
  - {id: R09, requisito: "ETL sobre dados importados da base PIB e VAF (IPARDES)", como_demonstrar: "Processar arquivo de PIB/VAF e exibir resultado nos gráficos", origem: "p111 item 4; p106 2.1.2.1.2"}
  - {id: R10, requisito: "ETL sobre dados importados da base Indicadores Educacionais (IPARDES)", como_demonstrar: "Processar arquivo de Indicadores Educacionais e exibir resultado nos gráficos", origem: "p112 item 4; p106 2.1.2.1.3"}
  - {id: R11, requisito: "ETL pesado assíncrono em sistema de filas de tarefas distribuído, sem travar o fluxo web; armazenamento em banco relacional", como_demonstrar: "Upload retorna imediatamente; worker (ex.: Celery+Redis/RabbitMQ) processa e grava no PostgreSQL", origem: "p106 2.1.2.2; p109 (Celery)"}
  - {id: R12, requisito: "Interface com lista de arquivos enviados e status (Enviado, Em processamento, Processado, Falha ao Processar)", como_demonstrar: "Tela de arquivos mostrando os quatro status", origem: "p112 item 4"}
  - {id: R13, requisito: "Interface para reenviar arquivos em caso de falha ao processar", como_demonstrar: "Forçar falha e reenviar pela tela", origem: "p112 item 4"}
  - {id: R14, requisito: "Notificação por e-mail ao usuário solicitante após o processamento", como_demonstrar: "E-mail recebido após o ETL", origem: "p112 item 4; p106 2.1.2.3"}
  - {id: R15, requisito: "E-mail informa sucesso ou falha do processamento", como_demonstrar: "Mostrar e-mail de sucesso e e-mail de falha", origem: "p112 item 4"}
  - {id: R16, requisito: "Envio do e-mail assíncrono (segundo plano)", como_demonstrar: "Envio por tarefa de background na fila", origem: "p112 item 4; p109 (Celery)"}
  - {id: R17, requisito: "Configurações SMTP implementadas e funcionais", como_demonstrar: "SMTP configurado por variáveis de ambiente/segredo e funcionando", origem: "p112 item 4"}
  - {id: R18, requisito: "Demonstrar que o usuário recebe efetivamente o e-mail", como_demonstrar: "Abrir caixa de entrada (servidor SMTP de teste ou do ambiente) e mostrar a mensagem", origem: "p112 item 4"}
