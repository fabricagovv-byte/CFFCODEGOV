avaliacao_da_fabrica:
  base: >-
    Projeto de referência projetos/gestao-documental: FastAPI + SQLAlchemy/Alembic + PostgreSQL, JWT próprio (pyjwt,
    bcrypt), login por e-mail, perfis/permissões, auditoria, e-mail simulado (app/mail.py sem SMTP real), React 19 +
    Vite (sem biblioteca de gráficos), testes pytest e vitest, Docker Compose, CI em GitHub Actions; Playwright usado
    só para capturas de tela (fabrica/ferramentas/capturar_telas.cjs), não como suíte E2E. Não há Kubernetes, Helm,
    ArgoCD, GitLab CI, fila de tarefas, Prometheus/Grafana, logs centralizados nem tracing.
  restricao_transversal: >-
    NÃO ATENDE como modelo operacional: a PoC proíbe IA generativa para gerar/sugerir/completar código, textos ou
    artefatos (p120 item 8.3) e proíbe trazer código de fora (acervo só na plataforma da Administração, p120 item 8.2).
    Agentes da fábrica, gerador de CRUD e esqueletos não podem ser usados durante a prova; o que vale é a equipe
    humana treinada na stack. A fábrica só pode ajudar ANTES (treino/ensaio), sem levar artefatos para a sala.
  itens:
    - {id: R01, avaliacao: ATENDE PARCIAL, justificativa: "Há cadastro de usuários pelo admin; não há autocadastro nem aplicação SSO separada"}
    - {id: R02, avaliacao: NÃO ATENDE, justificativa: "Login atual é por e-mail; não há login por CPF"}
    - {id: R03, avaliacao: NÃO ATENDE, justificativa: "Autenticação embutida em um único sistema; sem SSO entre aplicações"}
    - {id: R04, avaliacao: ATENDE, justificativa: "Perfis e permissões existentes (permissions.py)"}
    - {id: R05, avaliacao: ATENDE, justificativa: "Criação, edição e desativação (campo ativo) em routers/usuarios.py"}
    - {id: R06, avaliacao: NÃO ATENDE, justificativa: "JWT próprio, sem servidor/cliente OAuth2 (authorization code, introspecção) nem integração com IdP externo"}
    - {id: R07, avaliacao: ATENDE PARCIAL, justificativa: "Existe upload de arquivos (MOD-003), mas não de datasets para processamento"}
    - {id: R08, avaliacao: NÃO ATENDE, justificativa: "Não há ETL de Demografia"}
    - {id: R09, avaliacao: NÃO ATENDE, justificativa: "Não há ETL de PIB/VAF"}
