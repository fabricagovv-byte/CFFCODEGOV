  resumo: "ATENDE 8; ATENDE PARCIAL 23; NÃO ATENDE 32 (de 63). Itens críticos de p116 (SSO, ingestão IPARDES, CI/CD operacional, Prometheus/Grafana): nenhum ATENDE."

conflitos_ou_ambiguidades:
  - {descricao: "Anexo I.I pede que a empresa DESENVOLVA a aplicação de SSO (cadastro, login CPF, OAuth2), mas o Roteiro diz que a Administração fornece 'provedor de identidade de teste' e libera a Internet para ele no fluxo OAuth2. Não está claro se é para construir um IdP próprio ou integrar com o fornecido.", paginas: "p105 2.1.1; p111; p118 item 4; p119 item 8"}
  - {descricao: "Ingestão 'exclusivamente' com datasets públicos do IPARDES vs. massas de dados fictícias ou mascaradas fornecidas pela Administração e versões V1–V3 que variam dados; a saída à Internet não lista o site do IPARDES.", paginas: "p105 2.1.2.1; p118 item 4; p119 item 8; p121 item 10"}
  - {descricao: "'A licitante deverá implantar um orquestrador' vs. 'A Administração provê ... o orquestrador de contêineres'.", paginas: "p106 2.1.3; p118 item 4"}
  - {descricao: "Repositório 'implantado durante a PoC, sob responsabilidade da licitante' vs. 'instância on-premises fornecida' e plataforma de versionamento exclusiva da Administração.", paginas: "p105 item 2; p107 2.1.4; p118 item 4; p120 item 8.2"}
  - {descricao: "Escolha de domínios para expor as aplicações 'para a internet' a critério da licitante vs. rede isolada com saída restrita a destinos liberados.", paginas: "p106 2.1.3.1; p119 item 8; p120 item 8.4"}
  - {descricao: "'Sucesso condicionado ao atendimento completo' e itens 'críticos' vs. 'sem itens eliminatórios isolados' e aprovação por nota mínima ponderada.", paginas: "p111; p116; p119 item 6"}
  - {descricao: "Roteiro afirma que eixos, pesos e nota mínima são conhecidos de antemão, mas esses valores não constam em p104–p122.", paginas: "p119 item 6"}
  - {descricao: "Requisito não atendido 'deverá haver justificativa e plano para fase posterior' (sugere tolerância) vs. julgamento binário sem correção fracionada.", paginas: "p116; p119 item 6"}
  - {descricao: "Anexo I.I descreve escopo detalhado, mas o 'conteúdo de prova propriamente dito' é anexo sigiloso entregue no momento, com variação de dados, campos, endpoint e contrato de interface; o Anexo I.I pode ser apenas indicativo.", paginas: "p118 intro; p121 item 10; p122 item 13"}
  - {descricao: "'Pelo menos 500 UST de trabalho' na PoC sem indicar como serão medidas nem relação com a tabela de UST do contrato.", paginas: "p104 item 1"}
  - {descricao: "Demonstrar recebimento efetivo de e-mail (SMTP funcional) sem destino SMTP na lista de saídas liberadas; correio pessoal/corporativo proibido na sala.", paginas: "p112; p119 item 8; p120 item 8.1"}
  - {descricao: "Observabilidade a ser implantada pela licitante vs. 'ferramenta de observabilidade da prova' como destino externo liberado (sugere ferramenta fornecida).", paginas: "p107 2.1.5; p119 item 8"}
  - {descricao: "Tracing 'em toda a cadeia de microserviços' como requisito da tabela vs. Jaeger apenas 'caso haja microsserviços'.", paginas: "p114; p117"}
  - {descricao: "Tecnologias apenas 'recomendadas', mas o resumo diz que a equipe demonstrará 'back-end Django, front-end React/Next.js' e p116 exige 'Prometheus/Grafana ativo'. Não fica claro se FastAPI ou Playwright são aceitos sem perda de pontos.", paginas: "p108–p110 item 3; p116; p117"}
  - {descricao: "Objetivos citam Manual de Usuário e Documento de Requisitos, mas a tabela de requisitos não os lista (lista Arquitetura, Guia de Implantação, plano e relatório de testes).", paginas: "p107 2.1.7; p114–p116"}
  - {descricao: "Proibição de IA generativa abrange 'textos ou artefatos', inclusive documentação; também não há regra explícita sobre autocompletar não-IA, geradores de código determinísticos ou scaffolds trazidos de fora (estes conflitam com 8.2).", paginas: "p120 itens 8.2 e 8.3"}
  - {descricao: "Prazos de retenção e eliminação de artefatos 'em prazos certos' não informados; teto de pessoas presentes não informado; composição/tamanho de equipe não informado.", paginas: "p118 item 5; p120 item 9; p121 item 11"}
  - {descricao: "Erros de redação: 'população mundial municipal' (Demografia); 'visualizar a reenviar'; 'orquestrador de de PoC'.", paginas: "p106; p107; p112"}
