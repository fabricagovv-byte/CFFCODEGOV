poc_roteiro:
  - {etapa: "1. Convocação", o_que_fazer: "Administração convoca formalmente a 1ª colocada já habilitada", tempo: "não menos de 5 dias úteis de antecedência", origem: "p118 item 3"}
  - {etapa: "2. Indicação da equipe", o_que_fazer: "Empresa aponta a equipe executora; troca não justificada vedada", tempo: "antes/durante a sessão (não especificado)", origem: "p118 item 5"}
  - {etapa: "3. Termos de sigilo", o_que_fazer: "Integrantes firmam termo de sigilo da PoC; observadores firmam termo próprio e concordam com gravação", tempo: "antes de iniciar", origem: "p119 item 7; p120 item 9"}
  - {etapa: "4. Ingresso e isolamento", o_que_fazer: "Crachá temporário; guarda lacrada de aparelhos pessoais com recibo; estações ligadas só ao segmento reservado; conferência visual de IDEs com extensões de IA desligadas", tempo: "na entrada de cada turno", origem: "p119 item 8; p120 item 8.3"}
  - {etapa: "5. Sorteio da versão", o_que_fazer: "Sorteio aberto de envelope (V1/V2/V3) por pessoa sem interesse; SHA-256 do envelope em ata aberta", tempo: "início da sessão", origem: "p121 item 10; p122 item 13"}
  - {etapa: "6. Entrega das demandas", o_que_fazer: "Demandas entregues por inteiro (anexo sigiloso em envelope fechado e numerado)", tempo: "começo da sessão", origem: "p119 item 6; p121–p122 item 13"}
  - {etapa: "7. Execução", o_que_fazer: "Construção manual, sem IA generativa, na plataforma de versionamento da Administração, com credenciais nominais auditadas; uso do orquestrador, IdP de teste e massas de dados fornecidos", tempo: "5 dias úteis; sem cronômetro por item, sem etapas parciais nem aferições intermediárias", origem: "p118 itens 3 e 4; p119 item 6; p120 itens 8.2 e 8.3"}
  - {etapa: "8. Lacre diário", o_que_fazer: "Computadores ficam na sala sob lacre numerado firmado pela empresa e pelo secretário; reabertura no dia seguinte diante de ambos", tempo: "fim de cada jornada", origem: "p119 item 8"}
  - {etapa: "9. Entrega final", o_que_fazer: "Entrega única dos artefatos", tempo: "ao fim do 5º dia útil", origem: "p119 item 6"}
  - {etapa: "10. Encerramento de acesso", o_que_fazer: "Revogação de credenciais e declaração do responsável de ausência de cópia local", tempo: "ao final", origem: "p120 item 8.2"}
  - {etapa: "11. Correção pela banca", o_que_fazer: "Banca apura cada item (binário; subsidiariamente escala objetiva), na apresentação e pela análise de artefatos; nota ponderada vs nota mínima", tempo: "não especificado", origem: "p116; p118–p119 itens 5 e 6"}
  - {etapa: "12. Atas", o_que_fazer: "Ata aberta (desempenho por eixo/categoria, percentual ponderado, SHA-256) e ata reservada (enunciado, dados, código, razões de não atendimento)", tempo: "a cada sessão", origem: "p119 item 5; p121 item 12"}
  - {etapa: "13. Resultado e recursos", o_que_fazer: "Aprovação ou reprovação fundamentada; se reprovada, convoca-se a seguinte; recursos com acesso ao enunciado e às razões", tempo: "após a PoC; sequência: PoC → recursos → homologação", origem: "p118 itens 2 e 3; p119 item 6; p121 item 12"}
  - {etapa: "14. Tratamento dos artefatos", o_que_fazer: "Retenção probatória, descaracterização e eliminação em prazos certos; cópia criptografada à empresa, a pedido", tempo: "prazos certos (não informados), sobrestados se houver disputa", origem: "p121 item 11"}

