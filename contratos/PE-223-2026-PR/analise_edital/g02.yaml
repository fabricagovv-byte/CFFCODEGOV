  - descricao: "Erros e inconsistências de redação: 'art. 130 da Lei Federal n.º 14.133, de 2022' (a lei é de 2021); prazo de 'documento complementar' de 1 dia útil (CG 6.4) contra '01 (um) dia' (CG 6.11); o TR 6.6.4 remete a 'subitem 6.6.2, I' e o 6.6.5 a 'incisos I e II' inexistentes; o TR 1.4.9 tem no título 'Business Intelligence (BI) Ciência de Dados' e no subitem 'BI, Big Data e IA'; resíduo de texto 'recur436sos' em 6.5.2."
