modelo_execucao_e_gestao:
  resumo: >-
    TR 5 (p047–p048): execução em 5 fases – (1) Planejamento e início: formalização do contrato,
    definição das equipes, reunião inicial e estruturação da governança/metodologia; (2) Prestação:
    demandas atendidas por OS com escopo específico, padrões técnicos e monitoramento contínuo de
    indicadores; (3) Medição e validação: aferição em UST, conformidade com requisitos e SLA, registro de
    evidências para a fiscalização; (4) Monitoramento periódico: relatórios gerenciais, reuniões
    periódicas e auditorias; (5) Encerramento e transição: avaliação final, transferência de conhecimento,
    desmobilização e documentação final. Controle (5.2): sistema de gestão de contratos para acompanhar SLA,
    relatórios periódicos, fiscalização contínua e sanções.
    TR 6 (p048–p059): gestão por fiscais e gestores designados, com sistema de monitoramento contratual,
    relatórios de execução, reuniões de acompanhamento e auditorias/avaliações técnicas. Marcos (6.1):
    Plano de Inserção – reunião inicial (fiscais, preposto e substitutos; até 5 dias úteis após a
    assinatura; saída: ata), configuração do ambiente (reprodução do ambiente nas dependências da
    contratada; até 15 dias úteis), absorção do conhecimento (até 10 dias úteis; saída: atas), capacitação
    (workshop sobre o método do órgão e os INMS, até 15 dias úteis, presencial ou por videoconferência,
    com preposto, responsáveis técnicos e equipe); Execução – reuniões de acompanhamento com pauta prévia
    (fiscalização, preposto, responsáveis técnicos; saída: ata e ações de melhoria); Finalização –
    prorrogação (ETP e análise de riscos nos 4 meses finais) e encerramento (reunião até 5 dias úteis após o
    término). Papéis (6.2–6.3): servidor ou comissão de gestão/fiscalização registra ocorrências; o
    representante do CONTRATANTE é designado por ato formal; o FISCAL DO CONTRATO (servidor indicado pela
    Diretoria) atesta a execução para liquidação; a contratada deve permitir auditorias interna e externa
    e comunicar anormalidades em tempo hábil; a fiscalização pode paralisar serviços. Comunicação:
    reuniões com pauta prévia e atas; esclarecimentos por escrito (TR 11.2.1.5–11.2.1.6); reajustes
    comunicados ao preposto (TR 16.2). Sigilo absoluto sobre dados e códigos-fonte (6.4); transição nos
    últimos 60 dias com relatório final de transferência de conhecimento e entrega das bases de dados
    (6.5); rescisão (6.6).
  papeis:
    - papel: "Gestor do contrato (valida a execução para pagamento)"
      origem: "p059 (TR 7.1)"
    - papel: "Fiscal do contrato (servidor indicado pela Diretoria; atesta a execução para liquidação; valida relatórios de execução)"
      origem: "p054–p055 (TR 6.3.3); p059 (TR 7.2)"
    - papel: "Equipe de gestão e fiscalização indicada por ato formal do Gestor do Órgão"
      origem: "p054 (TR 6.3.2)"
    - papel: "Preposto e substitutos; responsáveis técnicos e substitutos (CONTRATADA)"
      origem: "p049; p051; p052"
    - papel: "Diretoria de Tecnologia da Informação do CONTRATANTE (coordena o workshop); STI (fornece parâmetros de backup/restore)"
      origem: "p051; p026"
  reunioes:
    - nome: "Reunião inicial"
      quando: "até 5 dias úteis após a assinatura"
      origem: "p049–p050"
    - nome: "Workshop de capacitação no método e na execução contratual"
      quando: "até 15 dias úteis após a assinatura"
      origem: "p051"
    - nome: "Reuniões de acompanhamento (pauta prévia)"
