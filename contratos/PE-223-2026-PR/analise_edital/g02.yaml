  - descricao: "Órgão contratante não está identificado de forma inequívoca: a licitação é conduzida pela SEAP/DECON, a dotação é da Casa Civil (130000) e o TR fala em 'Governo', 'Diretoria' e 'STI'. Fonte de Recursos e Programa de Trabalho têm o mesmo texto ('501/101'), o que sugere erro de preenchimento."
