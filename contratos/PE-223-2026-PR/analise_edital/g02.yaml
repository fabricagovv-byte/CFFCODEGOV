  - descricao: "Configuração do ambiente exige 'reprodução do ambiente tecnológico para o órgão CONTRATANTE nas dependências da CONTRATADA' em até 15 dias úteis. Isso pode conflitar com o sigilo absoluto sobre dados e código-fonte (6.4) e com a LGPD, e não se diz quais dados podem ser replicados."
