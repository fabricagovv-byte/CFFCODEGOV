medicao:
  unidade: "UST – Unidade de Serviço Técnico, 'métrica que representa o esforço necessário à execução das atividades previstas'"
  modelo: "UST (não PF, não horas). Modelo de exaustão do saldo contratado; prestação 'integralmente medida em UST, independentemente da natureza da atividade'. O TR não define conversão de UST em horas nem em PF."
  fatores_complexidade:
    - fator: 1
      expertise: "Júnior"
      aplicacao: "Tarefas triviais existentes dentro de base de conhecimento"
      multiplicacao: "1 × valor base UST"
    - fator: 2
      expertise: "Pleno"
      aplicacao: "Tarefas com maior grau de dificuldade, que demandam expertise profissional intermediária"
      multiplicacao: "2 × valor base UST"
    - fator: 3
      expertise: "Sênior"
      aplicacao: "Tarefas que exigem perfil especialista ou grau de senioridade avançada"
      multiplicacao: "3 × valor base UST"
  criterios_do_fator: "impacto institucional (inclusive requisitos regulatórios), necessidade de metodologias reconhecidas (engenharia de software, governança, segurança) e grau de senioridade requerido"
  regra: "O fator é aplicado ao valor base da UST definido no processo licitatório; cada OS deve conter a descrição detalhada do serviço, o quantitativo de UST base e o fator 'acordado entre as partes'. Exemplo: 300 UST base × fator 3 = 900 UST."
  origem: "p021–p022 (TR 1.3.1, tabela e nota)"
  quantidade_estimada_anual: "325.000 UST no período contratual inicial (TR 1.3); tabela: 130.000 UST estimadas/ano, 325.000 ajustadas pela complexidade. Distribuição por serviço é apenas referencial: todo o saldo pode ser consumido em um único serviço."
  como_se_mede: "Medição pela quantidade de UST consumidas conforme registrado nas Ordens de Serviço (TR 7.1). Etapa 'Medição e Validação': aferição com base em UST, avaliação da conformidade com requisitos técnicos e SLA e registro das evidências de execução para análise da fiscalização (TR 5.1.3). Medições e recebimentos são feitos por Ordem de Serviço, cada entrega verificada e liquidada de forma autônoma (justificativa do TR 10.2). Capacitação EaD, quando pedida em OS, é medida em UST como as demais entregas e não é serviço autônomo (TR 6.1.1)."
  ordem_de_servico:
    - "tipo de serviço (p020, TR 1.3)"
    - "descrição detalhada do escopo / do serviço (p020; p021 nota)"
    - "esforço estimado em UST / quantitativo de UST base (p020; p021)"
    - "fator de complexidade acordado entre as partes (p021 nota)"
    - "perfis profissionais requeridos (p020–p021)"
    - "prazos previstos para execução (p021)"
    - "quando houver capacitação EaD: o ambiente LMS de código aberto é definido na própria OS (p051)"
  validacao: "Pagamento após validação da execução pelo gestor do contrato (TR 7.1). Condições: conformidade técnica e operacional, aprovação dos relatórios de execução elaborados pela contratada e validados pelo fiscal, cumprimento de prazos e metas do SLA (TR 7.2). O fiscal do contrato comprova a adequação técnica e atesta o cumprimento que permite a liquidação (TR 6.3.3). Recebimento provisório em 30 dias (Termo de Aceite Provisório) e definitivo em 60 dias do provisório (Termo de Aceite Definitivo) (TR 10.2.1–10.2.2)."
  origem: "p018 (TR 1); p019–p022 (TR 1.3, 1.3.1, 1.3.2); p048 (TR 5.1.3); p051 (TR 6.1.1); p055 (TR 6.3.3); p059 (TR 7.1, 7.2); p060–p061 (TR 10.2)"

pagamento:
  regra: "Medição mensal por UST consumidas registradas nas OS; pagamento mensal após validação pelo gestor do contrato (TR 7.1). Pagamento por Ordem Bancária, depósito em conta corrente da contratada, acompanhado de Nota Fiscal/Fatura conforme Nota de Empenho, conferida e atestada pelo servidor ou comissão responsável pelo recebimento (TR 15.1)."
  prazo: "Até 30 dias após o encerramento do mês de uso do serviço (TR 15.1). Se o valor do contrato representado pela Nota de Empenho 'não ultrapassar o limite', até 5 dias úteis (TR 15.3; o limite não é definido nas páginas lidas). Atraso não causado pela contratada: EM = I × N × VP, I = 0,00016438 (6% a.a./365)."
  condicoes:
    - "Conformidade com requisitos técnicos e operacionais; aprovação dos relatórios de execução (validados pelo fiscal); cumprimento de prazos e metas do SLA (TR 7.2 – p059)"
    - "Cumprimento das exigências da Lei 14.133/2021 (TR 15.2 – p067)"
    - "Nenhum pagamento enquanto pendente obrigação financeira por penalidade ou inadimplência (TR 15.5 – p067)"
    - "Informação prévia de conta corrente na instituição financeira contratada pelo Estado (Decreto Estadual 4.505/2016) (Edital CG 11.4 – p011)"
    - "Consulta ao PNCP e ao GMS antes de cada pagamento para verificar a manutenção da habilitação (Edital CG 11.8 – p012)"
    - "Retenção na fonte dos tributos da legislação; glosa se percentual tributário cotado for maior que o adequado (Edital CG 4.4.2 e 4.8 – p005–p006)"
    - "Multa pode ser descontada de pagamentos de outros contratos (Edital CG 12.4 – p012)"
    - "Reajuste pelo ICTI/IPEA após 12 meses do orçamento base, por apostilamento; pedido até 30 dias antes do aniversário; IPCA se o ICTI não sair em 180 dias (TR 16 – p067–p068)"
  origem: "p059 (TR 7); p066–p067 (TR 15); p011–p012 (Edital CG 11.4, 11.7, 11.8); p067–p068 (TR 16)"

