  - {nome: "Declaração de Conhecimento", anexo: "Anexo VII — 03", origem: "p188"}
  - {nome: "Índices LG/SG/LC calculados com assinatura do contador e do representante legal (sem modelo)", anexo: "não consta modelo", origem: "p174 — Edital 1.5.5"}
