local_execucao:
  resumo: >-
    Entrega dos serviços na sede do órgão contratante (SGSD/Casa Civil, Rua Marechal Deodoro, 806, 13º andar, Curitiba-PR).
    Responsável Técnico (ou substituto) presente na sede, no mínimo, nas reuniões de abertura (planejamento) e de
    encerramento. Recebimento: CC/SGSD; horário 08:30–18:00, segunda a sexta. Diretriz de sustentabilidade dá preferência
    a atendimento remoto e teletrabalho para atividades compatíveis. PoC presencial ou remota em Curitiba/PR.
  origem: "p090 — TR 22.2.1–22.2.2; p171 — Anexo I.IX item 1; p189 — Edital Anexo VIII; p100 — TR 26.1.4; p096 — TR 24.3.6"

vigencia_e_prorrogacao:
  prazo: >-
    Vigência inicial de 12 meses a partir da assinatura (25.1). Prazo de execução de 12 meses a partir do recebimento da
    Ordem de Serviço (22.1). Início da execução em até 10 dias do recebimento da nota de empenho/assinatura do contrato (22.2).
  prorrogacao: >-
    Prorrogável sucessivamente por iguais períodos até 120 meses (art. 107 da Lei 14.133/2021), condicionada à conveniência
    administrativa, à vantajosidade comprovada e à boa execução.
  origem: "p090 — TR 22.1–22.2; p099 — TR 25.1"

criterios_sustentabilidade:
  - {criterio: "Uso eficiente de energia: priorizar nuvem; práticas de eficiência energética conforme ISO 50001; hardware com certificação de baixo consumo (ex.: ENERGY STAR)", origem: "p099 — TR 26.1.1"}
  - {criterio: "Redução de papel: processos digitais; registros, relatórios e comunicações assinados digitalmente e armazenados eletronicamente; campanhas de conscientização interna", origem: "p099–p100 — TR 26.1.2"}
  - {criterio: "Resíduos eletrônicos e logística reversa: plano de descarte (Lei 12.305/2010); descarte por empresas certificadas; reutilização e reciclagem", origem: "p100 — TR 26.1.3"}
  - {criterio: "Mobilidade sustentável: suporte remoto; veículos elétricos, transporte público ou compartilhado; políticas de teletrabalho", origem: "p100 — TR 26.1.4"}
  - {criterio: "Operações alinhadas a ISO 14001, Lei 12.305/2010 e ISO 50001 (rol não exaustivo)", origem: "p100 — TR 26.2"}
  - {criterio: "Relatórios periódicos de sustentabilidade exigidos pela fiscalização (periodicidade não consta)", origem: "p100 — TR 26.2"}
  - {criterio: "Declaração de atendimento à política ambiental de licitação sustentável (logística reversa pós-consumo)", origem: "p185 — Anexo V item 3"}

declaracoes_modelos:
  - {nome: "Declaração de não emprego de menor", anexo: "\"Anexo II\" (referência do TR/Edital); conteúdo no Anexo V item 2", origem: "p124 — TR 2.2.1; p174 — Edital 1.4.1; p185"}
  - {nome: "Procuração", anexo: "Anexo IV", origem: "p184"}
