disclaimer_ia:
  texto_resumo: >-
    Item 28 ("DISCLAMER DA ELABORAÇÃO DO TR COM USO DE IA"): o TR foi elaborado por pesquisa, estudo e redação humana com
    base em modelos aprovados pela PGE-PR; o texto foi revisado e corrigido com apoio de ferramentas de IA para clareza,
    estilo e consistência; não foram inseridos dados pessoais, privados ou sigilosos em ferramenta automatizada; a versão
    final reflete julgamento e responsabilidade exclusivos dos autores humanos; a IA atuou só como suporte na revisão,
    sem substituir a autoria; o conteúdo permanece sob responsabilidade do autor.
  origem: "p101 — TR item 28"

