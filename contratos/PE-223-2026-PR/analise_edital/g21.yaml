    - {alinea: g, tema: "Front-end React/Next/Vue", minimo: "10.000 UST", origem: "p127; p176"}
    - {alinea: i, tema: "Mobile Android e iOS", minimo: "5.000 UST", origem: "p127; p176"}
    - {alinea: j, tema: "BI / DW / ETL com capacitação", minimo: "5.000 UST", origem: "p128; p176"}
    - {alinea: l, tema: "Atendimento N2 + legados + infraestrutura", minimo: "5.000 UST", origem: "p128; p176"}
