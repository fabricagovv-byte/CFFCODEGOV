qualificacao_tecnica_detalhe:
  regras_gerais:
    - regra: "Atestados emitidos por órgão/entidade pública (qualquer esfera) e/ou pessoa jurídica de direito privado; admite somatório; diligência possível."
      origem: "p126 — TR 2.4.3; p175 — Edital 1.6.3"
    - regra: "Somatório para prazo mínimo de experiência em períodos sucessivos ou não, limite de 3 anos (art. 67, §5º); vedada duração mínima por atestado; sem limitação temporal dos atestados (art. 67, §2º)."
      origem: "p126 — TR 2.4.3; p175 — Edital 1.6.3"
    - regra: "Métrica padrão UST. Equivalência só para habilitação: 1 UST = 1 hora = 1 HST; 1 PF = 10 UST, desde que o atestado seja específico para o(s) item(ns)."
      origem: "p126 — TR 2.4.4–2.4.5; p175 — Edital 1.6.4–1.6.5"
    - regra: "Parcela de maior relevância: os atestados devem conter o núcleo dos serviços aderentes ao escopo (texto genérico; não indica uma parcela única)."
      origem: "p125 — TR 2.4.1; p175 — Edital 1.6.1"
    - regra: "Maturidade/gestão (m, n, o, p) aferíveis por equivalência, sem exigir certificado; evidências objetivas com datação externa; somatório admitido, salvo N1/N2."
      origem: "p131–p132 — TR regra geral; p178 — Edital regra geral"
