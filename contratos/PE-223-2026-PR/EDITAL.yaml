conflitos:
  G02:
  - descricao: 'Valor estimado / preço máximo: o Edital manda desclassificar propostas acima dos ''valores unitários máximos e totais máximos
      fixados no Termo de Referência'', mas o TR 9.1 diz que o valor estimado está em ''documento separado e classificado''. Nas páginas lidas
      não há valor unitário máximo da UST.'
    paginas: p002 (CE 1, 2.1, 2.3); p060 (TR 9.1)
  - descricao: 'Critério de julgamento: o Edital diz ''MENOR PREÇO'', com aceitabilidade por valor unitário; o TR 8.1 diz ''modalidade de menor
      preço global''. O Edital fala em ''lote(s)'' e o TR em lote único com 15 itens; não está claro se o lance é por UST única ou por item.'
    paginas: p001; p002; p046–p047 (TR 4); p059 (TR 8.1)
  - descricao: 'Quantidade: o TR 1.3 diz 325.000 UST ''ao longo do período contratual inicial'', mas a tabela traz a coluna ''Qtd. Estimada (Ano)''
      = 130.000 e ''Ajustada pela Complex'' = 325.000. Não está claro se o saldo contratado é 130.000 UST base ou 325.000 UST ponderadas.'
    paginas: p019 (TR 1.3); p020 (tabela)
  - descricao: 'Aplicação do fator de complexidade: a nota diz que o fator é aplicado ''ao valor base da UST'' (preço), mas o exemplo multiplica
      a quantidade (300 UST × 3 = 900 UST). A tabela fixa um fator por serviço, mas cada OS terá o fator ''acordado entre as partes''. Há risco
      de dupla aplicação (325.000 já ponderadas e novo fator por OS). A frase de fundamentação está truncada (''bem como às orientações da'').'
    paginas: p020; p021; p022 (TR 1.3, 1.3.1)
  - descricao: 'O Catálogo de Serviços com atividades, parâmetros e mensuração ainda não existe: será elaborado em comum acordo após a contratação.
      Não há nas páginas lidas tabela de UST por atividade/produto, o que impede orçar e medir de forma objetiva antes da assinatura.'
    paginas: p022 (TR 1.3.2)
  - descricao: 'Recebimento x pagamento: o TR 7.1 prevê pagamento mensal após validação e o TR 15.1 prevê até 30 dias após o fim do mês de uso.
      O TR 10.2 prevê recebimento provisório em 30 dias e definitivo em 60 dias do provisório. A justificativa admite que a soma dos prazos alonga
      o pagamento, mas não diz se o pagamento depende do aceite definitivo. O TR 15.3 cita ''não ultrapassar o limite'' (5 dias úteis) sem definir
      o limite.'
    paginas: p059 (TR 7.1); p060–p061 (TR 10.2); p066–p067 (TR 15.1, 15.3)
  - descricao: 'Referências cruzadas de anexos inconsistentes: a garantia remete à ''cláusula 11 da Minuta de Contrato (Anexo XI)'', mas o Anexo
      XI é a Declaração LGPD e a minuta é o Anexo IX (e também o Anexo I.VI). A lista de anexos duplica conteúdos (I.III/II, I.IV/III, I.V/VI,
      I.VII/X, I.VIII/XI, I.IX/XII). A ''Planilha de Custos e Formação de Preços'' exigida ''conforme anexo deste Edital'' não aparece na lista
      de anexos.'
    paginas: p003 (CE 7 e 9); p008 (CG 6.2.2)
  - descricao: 'Financiador: o Edital (Anexo XIII e CG 10.3) e o TR 2.1 citam o BIRD/Banco Mundial (Projeto Paraná Eficiente, PforR), mas o sumário
      do TR tem o item 20 ''Cláusulas Banco Interamericano de Desenvolvimento (BID)''.'
    paginas: p003; p011; p017 (sumário TR item 20); p044–p045 (TR 2.1)
  - descricao: 'Escopo além de CSD: o objeto é ''desenvolvimento de software personalizado (CSD)'', mas os itens 01–03 e o TR 1.1 c incluem suporte
