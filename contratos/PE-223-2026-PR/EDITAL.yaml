  orgao: 'Estado do Paraná, por intermédio do Departamento de Logística para Contratações Públicas da Secretaria de Estado da Administração e
    da Previdência – DECON/SEAP (licitante). Unidade orçamentária: 130000 – Casa Civil do Estado do Paraná.'
  processo: Protocolo nº 24.481.744-0
  numero_edital: Pregão Eletrônico nº 223/2026 (nº interno GMS); nº Compras.gov 36/2026; UASG 928658
  modalidade: Pregão Eletrônico, modo de disputa 'aberto' (lances públicos e sucessivos com prorrogações)
  criterio_julgamento: 'Menor preço (TIPO: MENOR PREÇO). Critério de aceitabilidade na disputa: valor unitário máximo fixado no TR; desclassificação
    acima dos valores unitários e totais máximos. O TR fala em ''menor preço global''. Lote único.'
  regime_juridico: 'Lei Federal nº 14.133/2021, Decreto Estadual nº 10.086/2022 e LC nº 123/2006. Serviço de natureza contínua, modelo de exaustão
    do saldo contratado, medido em UST. Minuta padronizada PGE/PR para ''prestação de serviços sem dedicação exclusiva de mão de obra''. Recursos
    com apoio do BIRD (Projeto Paraná Eficiente, componente PforR). Consórcio e subcontratação vedados. Regime de execução (empreitada etc.):
    não consta.'
  objeto: Contratação de empresa especializada em serviços de desenvolvimento de software personalizado (Custom Software Development – CSD), conforme
    estudos da Gartner, abrangendo sustentação, desenvolvimento, manutenção e evolução de sistemas, em modelo de catálogo de serviços estruturado
    em Unidades de Serviço Técnico (UST). O TR descreve ainda suporte (1º, 2º e 3º níveis), infraestrutura, DevOps, BI/Ciência de Dados, IA, gestão
    de projetos, jornada do cidadão, governança, segurança da informação e integração (15 itens).
  valor_estimado: não consta nas páginas lidas. O TR 9.1 informa que o valor estimado foi 'detalhado em documento separado e classificado'.
  vigencia: 12 (doze) meses, prorrogável por interesse das partes com base nos arts. 106 e 107 da Lei 14.133/2021
  data_sessao: 11/11/2026, às 10h00min (horário de Brasília)
  origem: 'Edital assinado em Curitiba, 29/09/2026 (Aline de Almeida Santos – Assessoria SEAP/DECON/DL; Eloisa Márcia Xavier da Silva – Equipe
    de Apoio). Pregoeiro: Luciano José de Lima (Resolução SEAP nº 12.224/2026). Inserido no protocolo em 22/10/2026. E-mail decondl2@seap.pr.gov.br.
    Edital publicado no PNCP, comprasparana.pr.gov.br e gov.br/compras.'
