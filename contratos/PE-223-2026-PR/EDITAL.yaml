# Exigências do edital PE 223/2026 extraídas pelos agentes (com página). Revisão humana pendente.
_fonte: Edital PE 223/2026 (Paraná), 223 páginas, lido por G02/G05/G21/G22/G23 da fábrica; cada item cita a página (pNNN).
documentos:
  ppj:
    titulo: Planejamento de Projeto Sustentável (PPJ)
    secoes_extras: []
relatorios_exigidos:
- Relatório mensal sobre a prestação dos serviços
- Relatórios de execução (elaborados pela contratada e validados pelo fiscal)
- Relatórios gerenciais / relatórios periódicos
- Relatório/documentação final de transferência de conhecimento
- Relatórios técnicos de conformidade com políticas e normas de segurança
- Relatório da taxa de transmissão dos links ativos
- Relatório de indisponibilidade dos serviços
- Relatórios de desempenho e integridade de banco de dados
- Relatórios de execução e qualidade de testes
- Relatórios gerenciais de acompanhamento de projetos
- Relatórios da solução de gestão de TIC
- Relatórios gerenciais da solução de gestão de projetos
- Relatórios de disponibilidade e consumo das integrações e dashboards
medicao:
  unidade: UST – Unidade de Serviço Técnico, 'métrica que representa o esforço necessário à execução das atividades previstas'
  modelo: UST (não PF, não horas). Modelo de exaustão do saldo contratado; prestação 'integralmente medida em UST, independentemente da natureza
    da atividade'. O TR não define conversão de UST em horas nem em PF.
  fatores_complexidade: '[{aplicacao: Tarefas triviais existentes dentro de base de conhecimento, expertise: Júnior, fator: 1, multiplicacao:
    1 × valor base UST}, {aplicacao: ''Tarefas com maior grau de dificuldade, que demandam expertise profissional intermediária'', expertise:
    Pleno, fator: 2, multiplicacao: 2 × valor base UST}, {aplicacao: Tarefas que exigem perfil especialista ou grau de senioridade avançada, expertise:
    Sênior, fator: 3, multiplicacao: 3 × valor base UST}]'
  criterios_do_fator: impacto institucional (inclusive requisitos regulatórios), necessidade de metodologias reconhecidas (engenharia de software,
    governança, segurança) e grau de senioridade requerido
  regra: 'O fator é aplicado ao valor base da UST definido no processo licitatório; cada OS deve conter a descrição detalhada do serviço, o quantitativo
    de UST base e o fator ''acordado entre as partes''. Exemplo: 300 UST base × fator 3 = 900 UST.'
  origem: p018 (TR 1); p019–p022 (TR 1.3, 1.3.1, 1.3.2); p048 (TR 5.1.3); p051 (TR 6.1.1); p055 (TR 6.3.3); p059 (TR 7.1, 7.2); p060–p061 (TR
    10.2)
  quantidade_estimada_anual: '325.000 UST no período contratual inicial (TR 1.3); tabela: 130.000 UST estimadas/ano, 325.000 ajustadas pela complexidade.
    Distribuição por serviço é apenas referencial: todo o saldo pode ser consumido em um único serviço.'
  como_se_mede: 'Medição pela quantidade de UST consumidas conforme registrado nas Ordens de Serviço (TR 7.1). Etapa ''Medição e Validação'':
    aferição com base em UST, avaliação da conformidade com requisitos técnicos e SLA e registro das evidências de execução para análise da fiscalização
    (TR 5.1.3). Medições e recebimentos são feitos por Ordem de Serviço, cada entrega verificada e liquidada de forma autônoma (justificativa
    do TR 10.2). Capacitação EaD, quando pedida em OS, é medida em UST como as demais entregas e não é serviço autônomo (TR 6.1.1).'
  ordem_de_servico: '[''tipo de serviço (p020, TR 1.3)'', descrição detalhada do escopo / do serviço (p020; p021 nota), esforço estimado em UST
    / quantitativo de UST base (p020; p021), fator de complexidade acordado entre as partes (p021 nota), perfis profissionais requeridos (p020–p021),
    prazos previstos para execução (p021), ''quando houver capacitação EaD: o ambiente LMS de código aberto é definido na própria OS (p051)'']'
  validacao: 'Pagamento após validação da execução pelo gestor do contrato (TR 7.1). Condições: conformidade técnica e operacional, aprovação
    dos relatórios de execução elaborados pela contratada e validados pelo fiscal, cumprimento de prazos e metas do SLA (TR 7.2). O fiscal do
    contrato comprova a adequação técnica e atesta o cumprimento que permite a liquidação (TR 6.3.3). Recebimento provisório em 30 dias (Termo
    de Aceite Provisório) e definitivo em 60 dias do provisório (Termo de Aceite Definitivo) (TR 10.2.1–10.2.2).'
