prova_de_conceito:
  objetivo: 'Comprovar a capacidade técnica e operacional da empresa em entregar, em curto prazo, uma solução integrada de TI: (1) aplicação de
    controle de acesso SSO (cadastro, login único, permissões, OAuth2) e (2) aplicação cliente-servidor de gestão de dados (ingestão de datasets
    IPARDES, ETL assíncrono em fila, notificação por e-mail, dashboards), conteinerizadas e orquestradas (Kubernetes), com CI/CD, GitOps, observabilidade
    (métricas, logs, tracing, alertas), testes automatizados de UI e API, documentação em português e LGPD. Abrange "pelo menos 500 UST de trabalho".
    No rito, é etapa de julgamento (não de habilitação) para comprovar, por amostragem técnica, a capacidade da 1ª colocada já habilitada.'
  prazo_preparacao: Convocação formal com não menos de 5 (cinco) dias úteis de antecedência (p118, item 3). O conteúdo da prova (anexo sigiloso)
    só é entregue no início da sessão (p118 intro; p121–p122 itens 10 e 13).
  duracao: 5 (cinco) dias úteis (p104 item 1; p116 item 5; p118 item 3). Demandas entregues por inteiro no começo e entrega única ao fim do 5º
    dia útil, sem cronômetro por item nem etapas parciais (p119 item 6).
  local_forma: Presencial, em dependências indicadas pela Administração em Curitiba/PR (p118 item 3). Sala exclusiva e isolada, crachá temporário,
    rede segregada com firewall e saída à Internet só para destinos liberados (provedor de identidade de teste OAuth2, repositórios oficiais de
    dependências, ferramenta de observabilidade da prova) (p119 item 8). Ambiente de execução, orquestrador, plataforma de versionamento, IdP
    de teste e massas de dados fictícias/mascaradas fornecidos pela Administração; computadores da empresa só como estações; código fica na plataforma
    de versionamento da Administração (p118 item 4; p120 item 8.2). Tráfego de rede registrado (metadados) (p119–p120 item 8.1). Proibida IA generativa
    (p120 item 8.3). Proibidas conexões externas (p120 item 8.4). Captação audiovisual da sala com observadores (p120 item 9). Sorteio aberto
    de uma entre três versões equivalentes (V1/V2/V3) do enunciado (p121 item 10).
  criterios_aprovacao:
  - Correção por banca técnica (fiscal técnico + especialistas); cada item apurado por critério binário atende/não atende, subsidiariamente por
    escala objetiva (p118–p119 item 5).
  - Aprova-se quem atingir nota mínima sobre a soma ponderada dos itens marcados como atende; sem itens eliminatórios isolados; sem correção fracionada;
    tolerância embutida na nota mínima (p119 item 6).
  - Eixos, pesos, forma de pontuar e nota mínima declarados como conhecidos de antemão pelo Roteiro (p119 item 6) — porém os valores NÃO constam
    das páginas p104–p122 (ver conflitos).
  - Tabela de requisitos do Anexo I.I serve de checklist Atendido/Não Atendido; todos os pontos obrigatórios devem ser cumpridos na demonstração
    final (p111 item 4).
  - Validação durante a apresentação e pela análise dos artefatos (código, documentação, relatórios de teste) (p116).
  - 'Sucesso condicionado ao atendimento completo dos requisitos, especialmente itens críticos: SSO funcional, ingestão de dados IPARDES, pipeline
    CI/CD operacional e monitoramento Prometheus/Grafana ativo (p116).'
  - Requisito não atendido exige justificativa documentada e, se possível, plano para fase posterior (p116).
  - 'Regras essenciais cuja violação reprova: uso de correio/mensageiro/nuvem pessoal etc. (p120 item 8.1); plataformas externas ou cópia do acervo
    para fora (p120 item 8.2); uso de IA generativa (p120 item 8.3); conexões externas não oficiais (p120 item 8.4).'
  - Equipe executora indicada pela empresa, vedada troca não justificada (p118 item 5); termo de sigilo antes de iniciar (p119 item 7).
  consequencia_reprovacao: Reprovação fundamentada e registrada em ata, com contraditório na fase de recursos (p119 item 6); convoca-se a empresa
    seguinte na ordem de classificação para a mesma etapa (p118 item 3), com redação diversa do enunciado (p121 item 10). Na fase de recursos
    a reprovada tem acesso ao enunciado aplicado, à sua entrega e à fundamentação de cada item reprovado (p121 item 12). Código da prova nunca
    é aproveitado em produção (p121 item 11).
  origem: p104 (Anexo I.I item 1), p105 item 2, p111 item 4, p116, p118–p122 (Anexo I.II itens 1–13)
