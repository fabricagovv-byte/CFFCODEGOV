# Proxy reverso de borda com TLS para homologação/produção.
# Certificados: fornecidos pelo órgão ou Let's Encrypt. Montados em /etc/nginx/certs.
server {
  listen 80;
  server_name ${DOMINIO};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMINIO};
  server_tokens off;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 25m;
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # sobrescreve: o cliente não forja o IP
    proxy_set_header X-Forwarded-Proto https;
  }
}
