# FORMULÁRIO DO CONTRATO — preencha somente o que o Analista de Editais (G02)
# não encontrou nos documentos. Campos com "<...>" ou vazios = faltando.
# Conferir o que falta:  python3 fabrica/ferramentas/fabrica.py contrato faltantes <ID_CONTRATO>
# Campos iniciados por "_" são comentários/ajuda e não são cobrados.

id: <ID_CONTRATO>

contratante:                       # 1
  orgao: ""                        # Ex.: Prefeitura Municipal de ...
  esfera: ""                       # federal | estadual | municipal | distrital
  cnpj: ""
  gestor_contrato: ""              # Nome e cargo do gestor do contrato (contratante)
  fiscal_tecnico: ""               # Nome e cargo do fiscal técnico

contrato:
  numero: ""                       # 2
  processo: ""                     # 3
  edital: ""                       # 4
  modalidade_licitacao: ""         # pregão eletrônico, concorrência, ...
  regime_juridico: ""              # Ex.: Lei 14.133/2021 (ou 8.666/93 em contratos antigos)
  objeto: ""                       # 5
  vigencia_inicio: ""              # 6  AAAA-MM-DD
  vigencia_fim: ""
  prazo_execucao: ""               # 7
  valor_global: ""
  aditivos: []                     # lista: [{numero, data, objeto}]

ordens_servico: []                 # 8  lista: [{numero, data, objeto, autorizado_por, prazo}]

medicao:
  modalidade: ""                   # 9  UST | PF | HORAS | ENTREGAVEL | MISTA
  metodologia: ""                  # Ex.: catálogo de serviços do TR; IFPUG CPM 4.3; Roteiro SISP
  formula: ""                      # UST_POR_SERVICO | HORAS_X_FATOR | HORAS — como o CONTRATO calcula (ver PERFIS.csv e CATALOGO_SERVICOS.csv)
  valor_unitario: ""               # Valor da UST/PF conforme contrato
  quantidade_contratada: ""        # 10
  tabela: TABELA_UST.csv           # 11 (preencher o CSV na mesma pasta)
  regra_medicao_parcial: ""        # O contrato permite medir parcialmente? Como?
  glosas_e_sla: ""                 # Indicadores e glosas previstos

criterios_aceite: []               # 12  lista de critérios com cláusula de origem

equipe:
  profissionais: PROFISSIONAIS.csv # 13-16 (preencher o CSV: nome, função, qualificação, responsabilidades)
  exigencias_edital: []            # Ex.: "Gerente de projeto com PMP", "Arquiteto com 5 anos"
  preposto: ""

tecnico:
  tecnologias_obrigatorias: []     # 17 Ex.: [Java 21, PostgreSQL 16]
  tecnologias_vedadas: []
  repositorio: ""                  # 18 URL do repositório (GitHub/GitLab do órgão ou do contratado)
  banco_de_dados: ""               # 19
  infraestrutura: ""               # 20 nuvem do órgão, datacenter próprio, nuvem pública...
  integracoes: []                  # 21 sistemas a integrar (gov.br, SIAFI, e-SIC, ...)
  ambiente_homologacao: ""         # 22 URL/servidor
  ambiente_producao: ""            # 23 URL/servidor
  requisitos_seguranca: []         # 24 Ex.: [ISO 27001, login gov.br, LGPD, logs 5 anos]
  acessibilidade: ""               # Ex.: eMAG/WCAG 2.1 AA

autorizacao_execucao:              # 25
  autorizado: false                # true somente após OS assinada
  autorizado_por: ""               # nome/cargo de quem autorizou
  data: ""
  documento: ""                    # Nº da OS / ofício / e-mail
  pode_publicar_producao: false    # publicação em produção exige autorização separada
