# EXIGÊNCIAS E ADAPTAÇÕES DO EDITAL — preenchido pelo Analista de Editais (G02) ao ler edital/TR/contrato.
# Tudo aqui SOBRESCREVE o padrão da fábrica: se o edital pede outro nome, outra seção ou outra periodicidade, mude aqui.
# Cite sempre a origem (documento + cláusula/página).
# Depois de preencher: python3 fabrica/ferramentas/fabrica.py edital confrontar <ID>

documentos:                         # títulos e seções que o edital exige
  ppj:
    titulo: "Planejamento de Projeto Sustentável (PPJ)"   # ex.: "Plano de Trabalho" se o edital chamar assim
    secoes_extras: []               # ex.: [{nome: "Plano de Transição", orientacao: "TR 8.2: ..."}]
  fechamento: {titulo: "Fechamento diário"}
  relatorio_diario: {titulo: "Relatório diário"}
  relatorio_semanal: {titulo: "Relatório semanal"}
  relatorio_mensal: {titulo: "Relatório mensal"}       # ex.: "Relatório Mensal de Execução (RME)"

relatorios_exigidos: [diario, semanal, mensal]   # periodicidade cobrada pelo órgão

medicao:
  unidade: UST                      # UST | PF | HORA | ENTREGAVEL

equipe_exigida: []
#  - perfil: "Gerente de Projeto"
#    quantidade: 1
#    palavras_chave: ["gerente", "coordenador"]   # como a função pode aparecer no documento base
#    certificacoes: ["PMP"]
#    experiencia_anos: 5
#    formacao: "Tecnologia da Informação"
#    origem: "TR 7.1, p. 23"

tecnologias_exigidas: []            # ex.: [{nome: "Java", origem: "TR 4.2"}, {nome: "PostgreSQL", origem: "TR 4.3"}]
certificacoes_empresa_exigidas: []  # ex.: [{nome: "ISO 27001", origem: "Edital 9.4"}, {nome: "atestado de capacidade técnica"}]
documentos_exigidos: []             # outros entregáveis nomeados no edital, ex.: [{nome: "Plano de Comunicação", origem: "TR 10.1"}]
prazos: []                          # ex.: [{evento: "entrega do PPJ", prazo: "10 dias após a OS", origem: "TR 6.1"}]

servicos: []                        # explicação técnica de cada serviço do catálogo (G02)
#  - {codigo: "SRV-CRUD-M", nome: "Cadastro média complexidade", unidade: UST,
#     explicacao_tecnica: "Tela de lista/busca + formulário + API REST + tabela com migração + validações + auditoria + testes",
#     origem: "TR item 5.2, p. 14"}

habilitacao: []                     # documentos exigidos (G21)
#  - {grupo: "Qualificação técnica", documento: "Atestado de capacidade técnica", exigencia: "mín. 30% do objeto", origem: "Edital 9.3.1, p. 22", situacao: "a verificar"}

slas: []                            # níveis de serviço e glosas (G23)
#  - {indicador: "Prazo de entrega da OS", meta: "≤ prazo da OS", medicao: "data do aceite − data da OS", glosa: "1% por dia de atraso, até 10%", origem: "TR 11.2, p. 31"}

pagamento:
  regra: ""                         # ex.: "mensal, após aceite definitivo, em até 30 dias" (origem)
